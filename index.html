<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Kids v6 ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
    <style>
        /* ══ VARIABLES ══════════════════════════════ */
        :root {
            --bg: #0f0c29; --card: #1a1740; --card2: #221e52;
            --primary: #a78bfa; --primary-glow: rgba(167,139,250,0.35);
            --accent: #f472b6; --accent-glow: rgba(244,114,182,0.3);
            --green: #34d399; --red: #f87171; --yellow: #fbbf24;
            --text: #e2d9f3; --text-dim: #9181c4;
            --border: rgba(167,139,250,0.2); --input-bg: #120f2e;
            --shadow: 0 25px 60px rgba(0,0,0,0.5);
            --footer-color: rgba(255,255,255,0.2);
        }
        body.light-mode {
            --bg: #f0edff; --card: #ffffff; --card2: #f5f2ff;
            --primary: #7c3aed; --primary-glow: rgba(124,58,237,0.2);
            --accent: #db2777; --accent-glow: rgba(219,39,119,0.2);
            --green: #059669; --red: #dc2626; --yellow: #d97706;
            --text: #1e1b4b; --text-dim: #6d5fa6;
            --border: rgba(124,58,237,0.18); --input-bg: #ede9fe;
            --shadow: 0 25px 60px rgba(109,40,217,0.12);
            --footer-color: rgba(100,80,180,0.4);
        }
        body.light-mode .stars { opacity: 0.2; }

        body.theme-guerrero {
            --bg: #0a1628; --card: #0d1f3c; --card2: #112549;
            --primary: #38bdf8; --primary-glow: rgba(56,189,248,0.35);
            --accent: #fb923c; --accent-glow: rgba(251,146,60,0.3);
            --border: rgba(56,189,248,0.2); --input-bg: #071120;
            --footer-color: rgba(255,255,255,0.2);
        }
        body.light-mode.theme-guerrero {
            --bg: #e0f2fe; --card: #ffffff; --card2: #f0f9ff;
            --primary: #0369a1; --primary-glow: rgba(3,105,161,0.2);
            --accent: #ea580c; --accent-glow: rgba(234,88,12,0.2);
            --text: #0c1a2e; --text-dim: #336688;
            --border: rgba(3,105,161,0.18); --input-bg: #e0f2fe;
            --shadow: 0 25px 60px rgba(3,105,161,0.12);
            --footer-color: rgba(3,105,161,0.3);
        }

        /* ══ BASE ══════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(167,139,250,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(244,114,182,0.06) 0%, transparent 60%);
            transition: background 0.5s, color 0.5s;
        }

        .stars { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .star {
            position: absolute; border-radius: 50%; background: white;
            animation: twinkle var(--d) infinite var(--delay) ease-in-out;
        }
        @keyframes twinkle {
            0%,100% { opacity: 0.1; transform: scale(1); }
            50%     { opacity: 0.8; transform: scale(1.5); }
        }
        .hidden { display: none !important; }

        /* ══ APP CARD ═══════════════════════════════ */
        #app {
            position: relative; z-index: 1;
            background: var(--card); border-radius: 28px;
            width: 100%; max-width: 460px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,0.03) inset;
            overflow: hidden; transition: background 0.5s, border-color 0.5s;
        }
        .card-header {
            padding: 24px 28px 18px; background: var(--card2);
            border-bottom: 1px solid var(--border); position: relative;
        }
        .card-body { padding: 20px 28px 28px; }

        /* ══ LOGO + TOGGLE ══════════════════════════ */
        .logo {
            font-family: 'Baloo 2', cursive; font-size: 1.9rem; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; display: flex; align-items: center; gap: 8px;
        }
        .logo-sub {
            font-size: 0.7rem; color: var(--text-dim); font-weight: 600;
            letter-spacing: 3px; text-transform: uppercase; margin-top: 2px;
        }
        .theme-toggle {
            position: absolute; top: 18px; right: 20px;
            display: flex; align-items: center; gap: 7px; cursor: pointer;
        }
        .toggle-label { font-size: 0.67rem; font-weight: 800; letter-spacing: 1px; color: var(--text-dim); text-transform: uppercase; }
        .toggle-track {
            width: 44px; height: 24px; background: var(--input-bg);
            border: 1px solid var(--border); border-radius: 99px;
            position: relative; transition: background 0.3s, border-color 0.3s; flex-shrink: 0;
        }
        .toggle-thumb {
            position: absolute; top: 3px; left: 3px;
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--text-dim); font-size: 10px;
            line-height: 16px; text-align: center;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), background 0.3s;
        }
        body.light-mode .toggle-thumb { transform: translateX(20px); background: var(--primary); }
        body.light-mode .toggle-track { background: var(--primary-glow); border-color: var(--primary); }

        /* ══ CONFIG UI ══════════════════════════════ */
        .config-section { margin-top: 16px; }
        .section-label {
            font-size: 0.68rem; font-weight: 800; letter-spacing: 2px;
            text-transform: uppercase; color: var(--primary); margin-bottom: 9px;
            display: flex; align-items: center; gap: 6px;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .selector-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
        .selector-grid.cols-2 { grid-template-columns: repeat(2,1fr); }

        .choice-btn {
            height: 44px; border: 1px solid var(--border); border-radius: 12px;
            cursor: pointer; background: var(--input-bg); color: var(--text-dim);
            font-weight: 700; font-size: 0.82rem; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 4px;
            font-family: 'Nunito', sans-serif;
        }
        .choice-btn:hover { border-color: var(--primary); color: var(--text); }
        .choice-btn.selected          { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 16px var(--primary-glow); }
        .choice-btn.ruta-btn.selected { background: var(--yellow); color: #2d1a00; border-color: var(--yellow); box-shadow: none; }
        .choice-btn.pro-btn.selected  { background: var(--accent);  color: white; border-color: var(--accent);  box-shadow: none; }
        .choice-btn.expert-btn.selected{ background: var(--red);   color: white; border-color: var(--red);     box-shadow: none; }

        .input-group { margin-top: 14px; }
        .input-group label {
            font-size: 0.68rem; font-weight: 800; letter-spacing: 2px;
            text-transform: uppercase; color: var(--primary); display: block; margin-bottom: 6px;
        }
        .styled-input {
            width: 100%; padding: 12px 16px; background: var(--input-bg);
            border: 1px solid var(--border); border-radius: 12px; color: var(--text);
            font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 600;
            transition: border-color 0.2s, box-shadow 0.2s; outline: none;
        }
        .styled-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .styled-input::placeholder { color: var(--text-dim); }
        input[type="number"]::-webkit-inner-spin-button { opacity: 0.5; }

        .btn-start {
            width: 100%; padding: 16px; margin-top: 20px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; border: none; border-radius: 16px;
            font-size: 1.1rem; font-weight: 800; cursor: pointer;
            font-family: 'Nunito', sans-serif;
            box-shadow: 0 8px 24px var(--primary-glow);
            transition: transform 0.15s, box-shadow 0.15s; letter-spacing: 0.5px;
        }
        .btn-start:hover  { transform: translateY(-2px); box-shadow: 0 12px 30px var(--primary-glow); }
        .btn-start:active { transform: translateY(1px); }

        /* ══ GAME TOP BAR ═══════════════════════════ */
        .game-topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 24px; background: var(--card2);
            border-bottom: 1px solid var(--border);
        }
        .player-name { font-weight: 800; font-size: 0.9rem; }
        .score-pill {
            display: flex; align-items: center; gap: 5px;
            background: var(--input-bg); border: 1px solid var(--border);
            padding: 5px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 800;
        }
        .reload-btn {
            background: var(--input-bg); border: 1px solid var(--border);
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            color: var(--text-dim); font-size: 1rem;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .reload-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* Progress */
        .progress-wrap { padding: 10px 24px 0; background: var(--card2); }
        .progress-track { height: 6px; background: var(--input-bg); border-radius: 10px; overflow: hidden; }
        #progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
        }
        .progress-steps {
            display: flex; justify-content: space-between;
            font-size: 0.7rem; color: var(--text-dim); font-weight: 700;
            margin-top: 4px; padding-bottom: 10px;
        }

        /* Scene */
        .game-scene {
            margin: 0 24px 14px; background: var(--input-bg); height: 70px;
            border-radius: 16px; position: relative; overflow: hidden;
            border: 1px solid var(--border);
        }
        .scene-ground {
            position: absolute; bottom: 0; left: 0; right: 0; height: 14px;
            background: linear-gradient(180deg, var(--border) 0%, transparent 100%);
        }
        .character {
            position: absolute; bottom: 10px; font-size: 2rem;
            transition: all 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }
        #hero   { left: 10px; z-index: 2; }
        #target { right: 14px; }
        #danger { right: -70px; bottom: 12px; font-size: 1.6rem; }

        /* ══ GAME BODY ═══════════════════════════════ */
        .game-body { padding: 0 24px 22px; }

        /* ── MODO VERTICAL (niveles 1, 2, 3) ─────────
           Reproduce exactamente cómo se resuelve
           una suma/resta en el cuaderno:
           números arriba, raya, casillas abajo.
           Casillas etiquetadas M C D U de izq a der. */

        .vertical-math-container {
            display: flex; flex-direction: column;
            align-items: flex-end;   /* todo alineado a la derecha */
            margin: 12px 0 16px;
        }

        /* Etiquetas M C D U sobre las casillas */
        .digit-labels {
            display: flex;
            flex-direction: row-reverse; /* mismo orden visual que inputs-row */
            gap: 8px; margin-bottom: 4px;
        }
        .digit-label {
            width: 56px; text-align: center;
            font-size: 0.62rem; font-weight: 800; letter-spacing: 1.5px;
            text-transform: uppercase; color: var(--primary);
            background: var(--input-bg); border: 1px solid var(--border);
            border-radius: 6px; padding: 2px 0;
        }

        /* Números del problema */
        .math-numbers { display: flex; flex-direction: column; align-items: flex-end; width: 100%; }
        .math-row {
            display: flex; align-items: center; gap: 10px;
            font-family: 'Baloo 2', cursive; font-size: 2.6rem; font-weight: 700;
            color: var(--text); line-height: 1.2;
        }
        .math-op { font-size: 2rem; color: var(--primary); min-width: 28px; text-align: center; }

        .math-divider {
            width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
            border-radius: 10px; margin: 8px 0 10px;
        }

        /* Fila de casillas:
           flex-direction: row-reverse → el primer hijo (d-u = unidades)
           aparece a la DERECHA, igual que en el papel.
           Al escribir, el foco salta de U → D → C → M (de dcha a izq visualmente). */
        .inputs-row {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-start;
            gap: 8px;
        }
        .digit {
            width: 56px; height: 66px; font-size: 2.2rem; text-align: center;
            border: 2px solid var(--border); border-radius: 12px;
            color: var(--primary); background: var(--input-bg);
            font-family: 'Baloo 2', cursive; font-weight: 700; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .digit:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

        /* ── MODO HORIZONTAL (PRO / Expert) ──────── */
        .horizontal-box {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            margin: 14px 0;
        }
        .horizontal-op {
            font-family: 'Baloo 2', cursive; font-size: 2.4rem; font-weight: 700;
            color: var(--text); background: var(--input-bg);
            padding: 12px 28px; border-radius: 16px; border: 1px solid var(--border);
            letter-spacing: 4px;
        }
        .single-input {
            width: 160px; height: 66px; font-size: 2.2rem; text-align: center;
            border: 2px solid var(--primary); border-radius: 14px;
            color: var(--primary); background: var(--input-bg);
            font-family: 'Baloo 2', cursive; font-weight: 700; outline: none;
            box-shadow: 0 0 14px var(--primary-glow); transition: box-shadow 0.2s;
        }
        .single-input:focus { box-shadow: 0 0 22px var(--primary-glow); }

        /* ── FEEDBACK ────────────────────────────── */
        #feedback {
            min-height: 36px; font-weight: 800; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; padding: 6px 12px; transition: all 0.3s; text-align: center;
        }
        #feedback.correct { background: rgba(52,211,153,0.12); color: var(--green); }
        #feedback.wrong   { background: rgba(248,113,113,0.12); color: var(--red); }

        /* ── BOTÓN COMPROBAR ─────────────────────── */
        .btn-check {
            width: 100%; padding: 15px; margin-top: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; border: none; border-radius: 14px;
            font-size: 1.05rem; font-weight: 800; cursor: pointer;
            font-family: 'Nunito', sans-serif; letter-spacing: 0.5px;
            box-shadow: 0 6px 20px var(--primary-glow);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-check:hover  { transform: translateY(-1px); }
        .btn-check:active { transform: translateY(1px); box-shadow: 0 3px 10px var(--primary-glow); }
        .key-hint {
            font-size: 0.7rem; opacity: 0.7;
            background: rgba(255,255,255,0.15);
            padding: 2px 7px; border-radius: 6px; letter-spacing: 0.5px;
        }

        /* ══ WIN VIEW ═══════════════════════════════ */
        .win-view {
            padding: 40px 28px; text-align: center;
            background: radial-gradient(ellipse at center, rgba(167,139,250,0.12) 0%, transparent 70%);
        }
        .win-trophy { font-size: 5rem; animation: trophy-bounce 0.8s ease-out; }
        @keyframes trophy-bounce {
            0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
            60%  { transform: scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); }
        }
        .win-title {
            font-family: 'Baloo 2', cursive; font-size: 2.2rem; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin: 12px 0 8px;
        }
        .win-msg { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 24px; }
        .win-score-card {
            background: var(--input-bg); border: 1px solid var(--border);
            border-radius: 20px; padding: 20px; margin-bottom: 24px;
        }
        .win-score-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }
        .win-score-num {
            font-family: 'Baloo 2', cursive; font-size: 3.5rem; font-weight: 800;
            background: linear-gradient(135deg, var(--yellow), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; line-height: 1;
        }
        .btn-play-again {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; border: none; border-radius: 16px;
            font-size: 1.05rem; font-weight: 800; cursor: pointer;
            font-family: 'Nunito', sans-serif; letter-spacing: 0.5px;
            box-shadow: 0 8px 24px var(--primary-glow); transition: transform 0.15s;
        }
        .btn-play-again:hover { transform: translateY(-2px); }

        footer {
            margin-top: 20px; font-size: 0.7rem; color: var(--footer-color);
            text-align: center; font-weight: 700; z-index: 1;
            letter-spacing: 1px; text-transform: uppercase; transition: color 0.5s;
        }

        /* ══ ANIMACIONES ════════════════════════════ */
        @keyframes pulse-ring {
            0%   { box-shadow: 0 0 0 0 var(--primary-glow); }
            70%  { box-shadow: 0 0 0 14px transparent; }
            100% { box-shadow: 0 0 0 0 transparent; }
        }
        .pulse { animation: pulse-ring 0.5s ease-out; }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.4s ease-out; }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="app">

    <!-- ══ PANTALLA INICIO ═════════════════════════ -->
    <div id="view-login">
        <div class="card-header">
            <div class="logo">🧮 Math Kids <span style="font-size:1.2rem">v6</span></div>
            <div class="logo-sub">Aventura Matemática</div>
            <div class="theme-toggle" onclick="toggleTheme()" title="Cambiar modo">
                <span class="toggle-label" id="theme-label">Oscuro</span>
                <div class="toggle-track"><div class="toggle-thumb">🌙</div></div>
            </div>
        </div>
        <div class="card-body">

            <div class="config-section">
                <div class="section-label">Personaje</div>
                <div class="selector-grid cols-2">
                    <div class="choice-btn selected" id="opt-princesa" onclick="selectAvatar('princesa')">👸 Princesa</div>
                    <div class="choice-btn"          id="opt-guerrero" onclick="selectAvatar('guerrero')">⚔️ Guerrero</div>
                </div>
            </div>

            <div class="config-section">
                <div class="section-label">Operación</div>
                <div class="selector-grid cols-2">
                    <div class="choice-btn selected" id="opt-suma"  onclick="selectOp('sum')">➕ Sumas</div>
                    <div class="choice-btn"          id="opt-resta" onclick="selectOp('sub')">➖ Restas</div>
                </div>
            </div>

            <div class="config-section">
                <div class="section-label">Nivel</div>
                <div class="selector-grid">
                    <div class="choice-btn"            onclick="selectDiff(1,       this)">1 ⭐</div>
                    <div class="choice-btn selected"   onclick="selectDiff(2,       this)">2 ⭐</div>
                    <div class="choice-btn"            onclick="selectDiff(3,       this)">3 ⭐</div>
                    <div class="choice-btn ruta-btn"   onclick="selectDiff('ruta',  this)">🗺️ RUTA</div>
                    <div class="choice-btn pro-btn"    onclick="selectDiff('pro',   this)">🔥 PRO</div>
                    <div class="choice-btn expert-btn" onclick="selectDiff('expert',this)">💀 Expert</div>
                </div>
            </div>

            <div class="input-group">
                <label>Tu nombre</label>
                <input type="text" class="styled-input" id="player-name" placeholder="Escribe tu nombre..." maxlength="20">
            </div>
            <div class="input-group">
                <label>Cantidad de preguntas</label>
                <input type="number" class="styled-input" id="total-sums" value="5" min="1" max="50">
            </div>

            <button class="btn-start" onclick="start()">¡Comenzar Aventura! 🚀</button>
        </div>
    </div>

    <!-- ══ PANTALLA DE JUEGO ═══════════════════════ -->
    <div id="view-game" class="hidden">

        <!-- Top bar con nombre, puntos y botón reiniciar -->
        <div class="game-topbar">
            <span class="player-name" id="label-name"></span>
            <div class="score-pill">⭐ <span id="score-val">0</span></div>
            <button class="reload-btn" onclick="location.reload()" title="Reiniciar">↻</button>
        </div>

        <!-- Barra de progreso -->
        <div class="progress-wrap">
            <div class="progress-track"><div id="progress-bar"></div></div>
            <div class="progress-steps">
                <span id="level-tag">NIVEL 2</span>
                <span><span id="current-step">1</span> / <span id="label-total">5</span></span>
            </div>
        </div>

        <!-- Escena animada -->
        <div class="game-scene">
            <div class="scene-ground"></div>
            <div id="hero"   class="character">👸</div>
            <div id="danger" class="character">☁️</div>
            <div id="target" class="character">💎</div>
        </div>

        <div class="game-body">

            <!-- ★ MODO VERTICAL — Niveles 1, 2, 3 ★
                 Igual que en el cuaderno:
                 número 1 arriba, operador + número 2,
                 raya horizontal, y debajo las casillas
                 etiquetadas U · D · C · M             -->
            <div id="area-vertical" class="hidden">
                <div class="vertical-math-container">
                    <!-- Etiquetas de posición sobre las casillas -->
                    <div class="digit-labels" id="digit-labels-row"></div>

                    <!-- Los dos operandos -->
                    <div class="math-numbers">
                        <div class="math-row">
                            <span class="math-op" style="visibility:hidden">+</span>
                            <span id="val1">00</span>
                        </div>
                        <div class="math-row">
                            <span class="math-op" id="op-symbol">+</span>
                            <span id="val2">00</span>
                        </div>
                    </div>

                    <!-- Raya -->
                    <div class="math-divider"></div>

                    <!-- Casillas de respuesta (U a la derecha, M a la izquierda) -->
                    <div class="inputs-row" id="inputs-container"></div>
                </div>
            </div>

            <!-- ★ MODO HORIZONTAL — PRO / Expert ★ -->
            <div id="area-horizontal" class="horizontal-box hidden">
                <div class="horizontal-op" id="h-display">0 + 0</div>
                <input type="tel" id="ans-total" class="single-input" placeholder="?">
            </div>

            <div id="feedback"></div>

            <button class="btn-check" onclick="check()">
                Comprobar <span class="key-hint">Enter ↵</span>
            </button>
        </div>
    </div>

    <!-- ══ PANTALLA VICTORIA ═══════════════════════ -->
    <div id="view-win" class="hidden">
        <div class="win-view">
            <div class="win-trophy">🏆</div>
            <div class="win-title">¡MAGNÍFICO!</div>
            <p class="win-msg" id="final-msg"></p>
            <div class="win-score-card">
                <div class="win-score-label">Puntos Totales</div>
                <div class="win-score-num" id="final-score">0</div>
            </div>
            <button class="btn-play-again" onclick="location.reload()">🔄 Jugar de Nuevo</button>
        </div>
    </div>

</div>

<footer>© 2026 BufaloDesign Chile · Todos los derechos reservados</footer>

<script>
/* ── Estrellas de fondo ───────────────────────────── */
(function() {
    const el = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const sz = 1 + Math.random() * 2;
        s.style.cssText =
            `left:${Math.random()*100}%;top:${Math.random()*100}%;` +
            `width:${sz}px;height:${sz}px;` +
            `--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;` +
            `opacity:${Math.random()*0.6};`;
        el.appendChild(s);
    }
})();

/* ── Tema claro / oscuro ─────────────────────────── */
let isLight = false;
function toggleTheme() {
    isLight = !isLight;
    document.body.classList.toggle('light-mode', isLight);
    document.getElementById('theme-label').innerText = isLight ? 'Claro' : 'Oscuro';
    document.querySelector('.toggle-thumb').innerText = isLight ? '☀️' : '🌙';
}

/* ── Estado global ───────────────────────────────── */
let config = {
    name: '', type: 'princesa', op: 'sum', diff: 2,
    meta: 5, current: 1, targetSum: 0, mistakes: 0,
    isRuta: false, rutaStage: 1, score: 0, correctStreak: 0
};

const msgsCorrect = [
    '¡Eres increíble, [NAME]! 🌟',
    '¡Sigue así, [NAME], vas volando! 🚀',
    '¡Qué agilidad mental, [NAME]! ✨',
    '¡Eres un genio matemático, [NAME]! 🧠'
];
const msgError = '¡No te rindas, [NAME]! ¡Tú puedes! 💪';

/* ── Selectores de configuración ─────────────────── */
function selectAvatar(t) {
    config.type = t;
    document.getElementById('opt-princesa').classList.toggle('selected', t === 'princesa');
    document.getElementById('opt-guerrero').classList.toggle('selected', t === 'guerrero');
    document.body.classList.toggle('theme-guerrero', t === 'guerrero');
}
function selectOp(o) {
    config.op = o;
    document.getElementById('opt-suma').classList.toggle('selected',  o === 'sum');
    document.getElementById('opt-resta').classList.toggle('selected', o === 'sub');
}
function selectDiff(d, btn) {
    config.diff   = d;
    config.isRuta = (d === 'ruta');
    btn.parentElement.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

/* ── Inicio ──────────────────────────────────────── */
function start() {
    config.name          = document.getElementById('player-name').value.trim() || 'Kid';
    config.meta          = parseInt(document.getElementById('total-sums').value) || 5;
    config.score         = 0;
    config.correctStreak = 0;
    config.rutaStage     = 1;
    config.current       = 1;

    document.getElementById('hero').innerText    = config.type === 'princesa' ? '👸' : '⚔️';
    document.getElementById('target').innerText  = config.type === 'princesa' ? '💎' : '🐉';
    document.getElementById('label-name').innerText  = config.name;
    document.getElementById('label-total').innerText = config.meta;
    document.getElementById('score-val').innerText   = '0';

    document.getElementById('view-login').classList.add('hidden');
    document.getElementById('view-game').classList.remove('hidden');
    newSum();
}

/* ── Generar nueva operación ─────────────────────── */
function newSum() {
    let n1, n2, d;
    const diff = config.isRuta ? config.rutaStage : config.diff;

    // PRO / Expert mezclan dígitos al azar
    d = (diff === 'pro' || diff === 'expert')
        ? [1,2,3][Math.floor(Math.random()*3)]
        : diff;

    const max = Math.pow(10, d) - 1;
    const min = d === 1 ? 0 : Math.pow(10, d - 1);
    n1 = Math.floor(Math.random() * (max - min + 1)) + min;
    n2 = Math.floor(Math.random() * (max - min + 1)) + min;

    if (config.op === 'sub') {
        if (diff !== 'expert' && n1 < n2) [n1, n2] = [n2, n1];
        config.targetSum = n1 - n2;
    } else {
        config.targetSum = n1 + n2;
    }

    const tag       = document.getElementById('level-tag');
    const areaVert  = document.getElementById('area-vertical');
    const areaHoriz = document.getElementById('area-horizontal');

    if (diff === 'pro' || diff === 'expert') {
        /* ─ MODO HORIZONTAL ─ */
        tag.innerText = diff.toUpperCase();
        areaVert.classList.add('hidden');
        areaHoriz.classList.remove('hidden');
        document.getElementById('h-display').innerText =
            `${n1} ${config.op === 'sum' ? '+' : '−'} ${n2}`;
        const inp = document.getElementById('ans-total');
        inp.value = '';
        inp.focus();
        inp.oninput = (e) => {
            e.target.value = e.target.value.replace(
                diff === 'expert' ? /[^-0-9]/g : /[^0-9]/g, '');
        };
    } else {
        /* ─ MODO VERTICAL ─ */
        tag.innerText = 'NIVEL ' + diff;
        areaHoriz.classList.add('hidden');
        areaVert.classList.remove('hidden');
        document.getElementById('val1').innerText      = n1;
        document.getElementById('val2').innerText      = n2;
        document.getElementById('op-symbol').innerText = config.op === 'sum' ? '+' : '−';
        createVerticalInputs(d);
    }

    config.mistakes = 0;
    document.getElementById('danger').style.right = '-70px';
    const fb = document.getElementById('feedback');
    fb.innerText = ''; fb.className = '';
}

/* ── Casillas verticales U D C M ─────────────────────
   IDs internos:  ids[0] = 'd-u' (Unidades)
                  ids[1] = 'd-d' (Decenas)
                  ids[2] = 'd-c' (Centenas)
                  ids[3] = 'd-m' (Millares)

   Visualmente (gracias a flex-direction:row-reverse):
     M  C  D  U
   ← izquierda    derecha →

   El foco al escribir va de U hacia M (derecha a izq)
   El foco al borrar  va de M hacia U (izq a derecha)
──────────────────────────────────────────────────── */
function createVerticalInputs(d) {
    const container = document.getElementById('inputs-container');
    const labelsRow = document.getElementById('digit-labels-row');
    container.innerHTML = '';
    labelsRow.innerHTML = '';

    const numInputs = d + 1;                           // nivel 1→2 casillas, 2→3, 3→4
    const ids    = ['d-u','d-d','d-c','d-m'];
    const labels = ['U','D','C','M'];

    /* Etiquetas (mismo orden que inputs, row-reverse las pone bien) */
    for (let i = 0; i < numInputs; i++) {
        const lbl = document.createElement('div');
        lbl.className = 'digit-label';
        lbl.innerText = labels[i];
        labelsRow.appendChild(lbl);
    }

    /* Inputs */
    for (let i = 0; i < numInputs; i++) {
        const inp = document.createElement('input');
        inp.type         = 'tel';
        inp.className    = 'digit';
        inp.id           = ids[i];
        inp.maxLength    = 1;
        inp.inputMode    = 'numeric';
        inp.autocomplete = 'off';

        inp.oninput = function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 1);
            // saltar al siguiente campo (mayor posición)
            if (this.value && i < numInputs - 1) {
                document.getElementById(ids[i + 1]).focus();
            }
        };

        inp.onkeydown = function(e) {
            if (e.key === 'Enter')     { e.preventDefault(); check(); return; }
            if (e.key === 'Backspace' && !this.value && i > 0) {
                document.getElementById(ids[i - 1]).focus();
            }
        };

        container.appendChild(inp);
    }

    /* Foco inicial en Unidades */
    document.getElementById('d-u').focus();
}

/* ── Leer respuesta vertical ─────────────────────── */
function readVerticalAnswer() {
    const ids = ['d-u','d-d','d-c','d-m'];
    let s = '';
    // Construir número de mayor a menor posición
    for (let i = 3; i >= 0; i--) {
        const el = document.getElementById(ids[i]);
        if (el) s += el.value || '';
    }
    return parseInt(s);
}

/* ── Comprobar respuesta ─────────────────────────── */
function check() {
    const diff = config.isRuta ? config.rutaStage : config.diff;
    const userVal = (diff === 'pro' || diff === 'expert')
        ? parseInt(document.getElementById('ans-total').value)
        : readVerticalAnswer();

    const fb = document.getElementById('feedback');

    if (userVal === config.targetSum) {
        /* ✅ CORRECTO */
        config.score += 100;
        config.correctStreak++;
        document.getElementById('score-val').innerText = config.score;

        if (config.correctStreak % 2 === 0) {
            fb.innerText = msgsCorrect[Math.floor(Math.random() * msgsCorrect.length)]
                               .replace('[NAME]', config.name);
        } else {
            fb.innerText = '¡Excelente respuesta! 🌟';
        }
        fb.className = 'correct';
        animateApp('pulse');

        setTimeout(() => {
            config.current++;
            if (config.current > config.meta) {
                tryNextOrWin();
            } else {
                updateGameUI();
                newSum();
            }
        }, 900);

    } else {
        /* ❌ INCORRECTO */
        config.correctStreak = 0;
        config.mistakes++;
        fb.innerText = msgError.replace('[NAME]', config.name);
        fb.className = 'wrong';
        animateApp('shake');
        document.getElementById('danger').style.right = (config.mistakes * 50) + 'px';
    }
}

/* ── Progresión / victoria ───────────────────────── */
function tryNextOrWin() {
    if (config.isRuta && config.rutaStage !== 'expert') {
        const stages = [1, 2, 3, 'pro', 'expert'];
        config.rutaStage = stages[stages.indexOf(config.rutaStage) + 1];
        config.current   = 1;
        document.getElementById('current-step').innerText = 1;
        document.getElementById('progress-bar').style.width = '0%';
        document.getElementById('hero').style.left = '10px';
        newSum();
    } else {
        win();
    }
}

function win() {
    document.getElementById('view-game').classList.add('hidden');
    document.getElementById('view-win').classList.remove('hidden');
    document.getElementById('final-msg').innerText   = `¡Increíble ${config.name}! Has completado tu aventura.`;
    document.getElementById('final-score').innerText = config.score;
}

/* ── UI helpers ──────────────────────────────────── */
function animateApp(type) {
    const app = document.getElementById('app');
    app.classList.remove('pulse', 'shake');
    void app.offsetWidth;           // forzar reflow para reiniciar animación
    app.classList.add(type);
    setTimeout(() => app.classList.remove(type), 600);
}

function updateGameUI() {
    document.getElementById('current-step').innerText = config.current;
    document.getElementById('progress-bar').style.width =
        ((config.current - 1) / config.meta * 100) + '%';
    document.getElementById('hero').style.left =
        (10 + (config.current - 1) / config.meta * 75) + '%';
}

/* ── Enter global ────────────────────────────────── */
document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('view-game').classList.contains('hidden')) return;
    const active   = document.activeElement?.id;
    const digitIds = ['d-u','d-d','d-c','d-m'];
    // Los digit inputs ya tienen onkeydown con check(),
    // para ans-total y el resto lo disparamos aquí.
    if (!digitIds.includes(active)) { e.preventDefault(); check(); }
});
</script>
</body>
</html>
