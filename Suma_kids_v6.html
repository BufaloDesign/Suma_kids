<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma Kids v5: Ruta Maestra 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --main-color: #4a90e2;
            --accent-color: #673ab7;
            --text-color: #2c3e50;
            --success: #4caf50;
            --error: #f44336;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        #app {
            background: white;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .hidden { display: none; }

        /* Estilos de Operación */
        .op-container {
            font-size: 3rem;
            margin: 20px 0;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Formato Vertical */
        .vertical-mode .num-row { text-align: right; width: 150px; letter-spacing: 5px; }
        .vertical-mode .linea { width: 160px; height: 4px; background: var(--text-color); margin: 10px 0; }
        
        /* Formato Horizontal */
        .horizontal-mode { flex-direction: row; justify-content: center; gap: 15px; font-size: 2.5rem; }

        /* Inputs */
        .input-wrapper { display: flex; gap: 8px; justify-content: center; }
        .digit-input {
            width: 45px; height: 60px; font-size: 2rem; text-align: center;
            border: 3px solid #ddd; border-radius: 10px; font-family: 'Quicksand';
        }

        .single-input {
            width: 180px; height: 60px; font-size: 2.2rem; text-align: center;
            border: 3px solid var(--main-color); border-radius: 15px;
        }

        .btn {
            background: var(--main-color); color: white; border: none; padding: 15px 30px;
            border-radius: 15px; font-size: 1.2rem; font-weight: 700; cursor: pointer;
            width: 100%; transition: 0.2s; margin-top: 20px;
        }

        .btn:hover { filter: brightness(1.1); }

        .progress-box { margin-bottom: 20px; }
        .bar-bg { background: #eee; height: 10px; border-radius: 5px; overflow: hidden; }
        .bar-fill { background: var(--success); height: 100%; width: 0%; transition: 0.4s; }

        .badge {
            display: inline-block; padding: 5px 15px; background: var(--accent-color);
            color: white; border-radius: 20px; font-size: 0.8rem; margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- PANTALLA INICIO -->
    <div id="screen-start">
        <h1>🚀 Ruta Maestra</h1>
        <p>¡Elige tu camino de aprendizaje!</p>
        
        <div style="text-align: left; margin-bottom: 20px;">
            <label><b>Nombre del Explorador:</b></label>
            <input type="text" id="user-name" placeholder="Escribe aquí..." style="width:100%; padding:10px; margin-top:5px; border-radius:10px; border:2px solid #ddd;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn" onclick="initGame('sum')">Sumas (+)</button>
            <button class="btn" onclick="initGame('sub')" style="background:var(--accent-color)">Restas (-)</button>
        </div>
        <p style="font-size: 0.8rem; color: #666;">La dificultad subirá automáticamente cada 5 aciertos.</p>
    </div>

    <!-- PANTALLA JUEGO -->
    <div id="screen-game" class="hidden">
        <div class="progress-box">
            <div class="badge" id="level-badge">Nivel 1: Principiante</div>
            <div class="bar-bg"><div id="bar-fill" class="bar-fill"></div></div>
        </div>

        <div id="display-area" class="op-container">
            <!-- Se genera dinámicamente -->
        </div>

        <div id="feedback" style="height: 30px; font-weight: bold; margin-top: 10px;"></div>
        <button class="btn" onclick="checkAnswer()">Comprobar</button>
    </div>

    <!-- PANTALLA WIN -->
    <div id="screen-win" class="hidden">
        <h1 style="font-size: 4rem;">🏆</h1>
        <h2>¡Maestría Completada!</h2>
        <p id="win-text"></p>
        <button class="btn" onclick="location.reload()">Volver a empezar</button>
    </div>
</div>

<script>
    let gameState = {
        name: "",
        opType: "sum",
        score: 0,
        level: 1, // 1: 1 dig (vert), 2: 2-3 dig (vert), 3: horizontal, 4: Negativos
        currentAns: 0
    };

    function initGame(type) {
        gameState.name = document.getElementById('user-name').value || "Explorador";
        gameState.opType = type;
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
        generateChallenge();
    }

    function generateChallenge() {
        const area = document.getElementById('display-area');
        area.innerHTML = "";
        let n1, n2;

        // Lógica de dificultad por Niveles
        if (gameState.level === 1) {
            n1 = rand(1, 9); n2 = rand(1, 9);
        } else if (gameState.level === 2) {
            n1 = rand(10, 99); n2 = rand(10, 99);
        } else {
            n1 = rand(50, 500); n2 = rand(50, 500);
        }

        // Caso especial Negativos (Nivel 4+ en Restas)
        if (gameState.level >= 4 && gameState.opType === 'sub') {
            // Permitimos que n2 sea mayor que n1
        } else if (gameState.opType === 'sub' && n1 < n2) {
            [n1, n2] = [n2, n1];
        }

        gameState.currentAns = (gameState.opType === 'sum') ? n1 + n2 : n1 - n2;

        // RENDERIZADO
        if (gameState.level <= 2) {
            renderVertical(area, n1, n2);
        } else {
            renderHorizontal(area, n1, n2);
        }
    }

    function renderVertical(container, n1, n2) {
        container.className = "op-container vertical-mode";
        container.innerHTML = `
            <div class="num-row">${n1}</div>
            <div class="num-row" style="position:relative"><span style="position:absolute; left:-30px">${gameState.opType==='sum'?'+':'-'}</span>${n2}</div>
            <div class="linea"></div>
            <div class="input-wrapper" id="inputs-box"></div>
        `;
        
        // Crear casillas individuales (Ayuda visual)
        const digits = gameState.currentAns.toString().replace('-', '').length;
        const box = document.getElementById('inputs-box');
        for(let i=0; i<digits; i++) {
            const input = document.createElement('input');
            input.type = "tel";
            input.className = "digit-input";
            input.maxLength = 1;
            input.dataset.idx = i;
            // Bloqueo de símbolos
            input.oninput = (e) => { 
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                if(e.target.value && e.target.nextElementSibling) e.target.nextElementSibling.focus();
            };
            box.prepend(input); // Para que se escriba de derecha a izquierda
        }
    }

    function renderHorizontal(container, n1, n2) {
        container.className = "op-container horizontal-mode";
        container.innerHTML = `
            <div>${n1} ${gameState.opType==='sum'?'+':'-'} ${n2} =</div>
            <input type="text" id="ans-total" class="single-input" placeholder="?">
        `;
        // Permitir signo menos en nivel avanzado
        const input = document.getElementById('ans-total');
        input.oninput = (e) => {
            e.target.value = e.target.value.replace(/[^-0-9]/g, '');
        };
    }

    function checkAnswer() {
        let userVal;
        if (gameState.level <= 2) {
            let s = "";
            const inputs = document.querySelectorAll('.digit-input');
            // Como usamos prepend, recorremos en orden inverso para armar el número
            inputs.forEach(i => s = i.value + s);
            userVal = parseInt(s);
        } else {
            userVal = parseInt(document.getElementById('ans-total').value);
        }

        const fb = document.getElementById('feedback');
        if (userVal === gameState.currentAns) {
            fb.innerText = "¡Excelente! ✨"; fb.style.color = "var(--success)";
            gameState.score++;
            updateProgress();
            setTimeout(generateChallenge, 1000);
        } else {
            fb.innerText = "Inténtalo de nuevo ❌"; fb.style.color = "var(--error)";
        }
    }

    function updateProgress() {
        const progress = (gameState.score % 5) / 5 * 100;
        document.getElementById('bar-fill').style.width = progress === 0 && gameState.score > 0 ? "100%" : progress + "%";
        
        if (gameState.score > 0 && gameState.score % 5 === 0) {
            gameState.level++;
            if(gameState.level > 5) {
                showWin();
            } else {
                document.getElementById('level-badge').innerText = `Nivel ${gameState.level}: ${getLevelName()}`;
            }
        }
    }

    function getLevelName() {
        const names = ["", "Principiante", "Intermedio", "Maestro Mental", "Experto Negativos", "Leyenda"];
        return names[gameState.level];
    }

    function showWin() {
        document.getElementById('screen-game').classList.add('hidden');
        document.getElementById('screen-win').classList.remove('hidden');
        document.getElementById('win-text').innerText = `¡Increíble ${gameState.name}! Has dominado todas las etapas de la Ruta Maestra.`;
    }

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
</script>
</body>
</html>
